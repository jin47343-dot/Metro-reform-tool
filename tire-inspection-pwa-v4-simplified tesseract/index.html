<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174ea6"><title>轮胎检查 V4</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>轮胎检查</h1><small>本地记录 · 精简离线OCR · Excel导出</small></div><b>V4</b></header><main>
<section class="card"><h2>轮胎身份</h2><label>胎号 <small>3位字母 + 5位数字 + R</small><input id="serial" maxlength="9" placeholder="LLD95510R"></label><input id="serialPhoto" type="file" accept="image/*" capture="environment" hidden><button data-file="serialPhoto">📷 拍照识别胎号</button><img id="serialPreview"><p id="serialOcr"></p><label>生产周期 <small>周号2位 + 年号2位</small><input id="dot" maxlength="4" inputmode="numeric" placeholder="5025，即2025年第50周"></label><input id="dotPhoto" type="file" accept="image/*" capture="environment" hidden><button data-file="dotPhoto">📷 拍照识别生产周期</button><img id="dotPreview"><p id="dotOcr"></p></section>
<section class="card"><h2>检查数据</h2><div class="grid3"><label>左深度 mm<input id="depthL" type="number" step="0.1"></label><label>中深度 mm<input id="depthC" type="number" step="0.1"></label><label>右深度 mm<input id="depthR" type="number" step="0.1"></label></div><div class="grid2"><label>PMR代码<input id="pmr" placeholder="15, 31"></label><label>肩部磨损<select id="shoulder"><option value="">请选择</option><option>1</option><option>2</option><option>3</option></select></label></div><label>轮胎标记/备注<textarea id="notes" rows="3"></textarea></label><input id="markPhoto" type="file" accept="image/*" capture="environment" hidden><button data-file="markPhoto">📷 拍照识别轮胎记录</button><img id="markPreview"><p id="markOcr"></p></section>
<div class="actions"><button class="primary" id="saveBtn">保存记录</button><button id="resetBtn">清空表单</button></div><section class="card"><div class="title"><h2>本机记录</h2><span id="count"></span></div><div id="records"></div><div class="actions"><button class="success" id="exportBtn">⬇ 导出Excel</button><button class="danger" id="clearAllBtn">删除全部</button></div></section></main><div id="toast"></div><script src="ocr-config.js"></script><script src="vendor/tesseract/tesseract.min.js"></script><script src="app.js"></script></body></html>
